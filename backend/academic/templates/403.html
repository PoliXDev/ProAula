{% extends "academic/base.html" %}

{% block title %}Acceso restringido · ProAula{% endblock %}

{% block content %}
  <section class="mx-auto max-w-lg rounded-2xl bg-white p-6 shadow-sm">
    <h1 class="font-display text-2xl font-semibold">Acceso restringido</h1>
    <p class="mt-3 text-base">
      Acceso restringido exclusivamente al personal del centro.
    </p>
    <form method="post" action="{% url 'logout' %}" class="mt-6">
      {% csrf_token %}
      <button
        type="submit"
        class="min-h-12 rounded-xl bg-meadow-teal px-5 font-medium text-white hover:bg-meadow-bondi"
      >
        Cerrar sesión
      </button>
    </form>
  </section>
{% endblock %}
